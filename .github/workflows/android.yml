name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep debug signing identity for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nidaplayer-debug-keystore-v1

      - name: Test, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NidaPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: NidaPlayer-androidTest
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NidaPlayer-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  device-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nidaplayer-debug-keystore-v1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test AAC export and offline data on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NidaPlayer-device-test-reports
          path: app/build/reports/androidTests/
